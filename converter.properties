# UTF-8 settings. Use forward slashes for Windows paths.
conversion.max.bytes=52428800
conversion.max.chars=5000000

# OCR for PDFs and PNG/JPEG/TIFF/BMP images; requires Tesseract and language data.
ocr.enabled=true
# auto: OCR PDF pages with fewer than 10 non-whitespace text characters.
# always: OCR every PDF page instead of using its text layer.
ocr.mode=auto
ocr.language=eng
# Executable name on PATH, or full path such as C:/Program Files/Tesseract-OCR/tesseract.exe
ocr.executable=tesseract
# Timeout per OCR page/image; PDF rendering resolution in DPI (72..600).
ocr.timeout.seconds=120
ocr.pdf.dpi=300

# Preserve native tables as Markdown, including CSV/TSV. Does not infer scanned/PDF grids.
tables.enabled=true
# false: synthesize Column 1, Column 2, ... so the first source row remains data.
tables.first.row.header=true

# Topic sections for LLM retrieval. false restores one file per source.
splitting.enabled=true
# Soft body-size target; tables/code blocks stay intact and may exceed this value.
splitting.target.chars=6000
